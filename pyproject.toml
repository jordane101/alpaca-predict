[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "alpaca-predict"
version = "1.0.0"
description = "Trading system with HMM analysis and causal DAG relationships"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Eli Jordan"}
]
dependencies = [
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scikit-learn>=1.0.0",
    "hmmlearn>=0.2.7",
    "alpaca-py>=0.8.0",
    "vectorbt>=0.25.0",
    "statsmodels>=0.13.0",
    "networkx>=2.6.0",
    "matplotlib>=3.4.0",
    "plotly>=5.0.0",
    "scipy>=1.7.0",
    "python-dotenv>=0.19.0",
    "flask>=2.0.0",
    "flask-cors>=3.0.10",
    "apscheduler>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=22.0.0",
    "flake8>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.pkl"]
